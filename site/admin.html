<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HelpR&amp;D 관리자</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314243D'/%3E%3Cpath d='M9 23V9h4v5h6V9h4v14h-4v-5h-6v5z' fill='%23F28C28'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#14243D;--navy-2:#1F3557;--orange:#F28C28;--orange-soft:#FFF3E6;--ink:#1E2633;--muted:#667085;--line:#E4E7EC;--bg:#F5F7FA;--red:#D64545;--green:#1F8A5B;--blue:#2B4C8C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{background:var(--navy);color:#fff}
header .wrap{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:18px;text-decoration:none;color:#fff}.logo b{color:var(--orange)}
.who{font-size:13px;color:#C9D3E3;display:flex;gap:10px;align-items:center}
button,select,input,textarea{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.btn:hover{border-color:#C3CAD6}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent;color:#C9D3E3;border-color:rgba(255,255,255,.25)}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.6;cursor:wait}
/* login */
.login{max-width:400px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.login h1{margin:0 0 6px;font-size:22px}
.login p{margin:0 0 16px;color:var(--muted);font-size:14px}
.login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;margin-bottom:10px}
.login .btn{width:100%;padding:11px}
.msg{min-height:22px;margin-top:10px;font-size:14px;font-weight:700}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;line-height:1.2}
.stat .l{font-size:13px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.bar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.spacer{flex:1}
.leads{display:grid;gap:10px}
.lead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1.2fr 1fr 1.3fr;gap:16px}
.lead.new{border-left:4px solid var(--orange)}
.lead h3{margin:0 0 2px;font-size:17px}
.lead .when{font-size:12px;color:var(--muted)}
.lead .contact{font-size:14px;display:grid;gap:3px}
.lead .contact a{color:var(--blue);text-decoration:none}
.lead .q{font-size:14px;color:var(--ink);white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px}
.lead .q:empty{display:none}
.side{display:grid;gap:8px;align-content:start}
.side select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700}
.side textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:64px;resize:vertical;font-size:14px}
.side .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.saved{font-size:12px;color:var(--green);min-height:16px}
.st-신규{color:#B4610F}.st-연락함{color:var(--blue)}.st-상담중{color:#7A3FB8}.st-완료{color:var(--green)}.st-보류{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:50px 0;background:#fff;border:1px dashed var(--line);border-radius:14px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.lead{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="./">Help<b>R&amp;D</b> 관리자</a>
  <div class="who" id="who" hidden><span id="who-email"></span><button class="btn ghost" id="logout">로그아웃</button></div>
</div></header>

<!-- 로그인 -->
<div class="login" id="login" hidden>
  <h1>관리자 로그인</h1>
  <p>관리자 이메일을 입력하면 <b>로그인 링크</b>를 보내 드립니다. 메일의 링크를 누르면 바로 들어옵니다.</p>
  <form id="login-form">
    <input type="email" name="email" placeholder="관리자 이메일" autocomplete="email" required>
    <button class="btn pri" type="submit">로그인 링크 받기</button>
  </form>
  <div class="msg" id="login-msg"></div>
</div>

<!-- 대시보드 -->
<main class="wrap" id="app" hidden>
  <div class="stats">
    <div class="stat"><div class="n" id="s-all">-</div><div class="l">전체 신청</div></div>
    <div class="stat"><div class="n" id="s-new" style="color:#B4610F">-</div><div class="l">신규 (아직 연락 전)</div></div>
    <div class="stat"><div class="n" id="s-week">-</div><div class="l">최근 7일</div></div>
    <div class="stat"><div class="n" id="s-done" style="color:var(--green)">-</div><div class="l">상담 완료</div></div>
  </div>
  <div class="bar">
    <div id="chips" class="bar" style="margin:0"></div>
    <input type="search" id="q" placeholder="회사명·담당자·전화·이메일·내용 검색">
    <button class="btn" id="refresh">새로고침</button>
    <button class="btn" id="csv">엑셀(CSV) 받기</button>
  </div>
  <div class="leads" id="leads"></div>
  <p style="color:var(--muted);font-size:12px;margin:18px 0 40px">개인정보: 상담 종료 후 1년이 지난 신청은 삭제해 주세요 (개인정보처리방침의 보유기간). 이 페이지 주소는 외부에 공유하지 마세요.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  // 공개용 키(publishable)입니다. 데이터는 DB 보안 규칙(관리자 이메일만 열람)으로 보호됩니다.
  const SUPABASE_URL = "https://lqcdnzrsviivkajntmqs.supabase.co";
  const SUPABASE_KEY = "sb_publishable_iL8HYFDIfyBuQWprZAS9qA_wLKBx_rD";
  const STATUSES = ["신규","연락함","상담중","완료","보류"];
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let rows = [], filter = "전체", q = "";

  // ----- 로그인 -----
  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = e.target.email.value.trim();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    btn.disabled = false;
    const m = $("login-msg");
    if (error) { m.className = "msg err"; m.textContent = /not allowed|signups|not found/i.test(error.message) ? "등록된 관리자 이메일이 아닙니다." : "보내지 못했어요: " + error.message; }
    else { m.className = "msg ok"; m.textContent = "메일을 보냈어요. 메일함에서 로그인 링크를 눌러 주세요."; }
  });
  $("logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

  sb.auth.onAuthStateChange((_e, session) => show(session));
  sb.auth.getSession().then(({ data }) => show(data.session));

  let shown = null;
  function show(session){
    const key = session ? session.user.id : "none";
    if (shown === key) return; shown = key;
    $("login").hidden = !!session; $("app").hidden = !session; $("who").hidden = !session;
    if (session) { $("who-email").textContent = session.user.email; load(); }
  }

  // ----- 목록 -----
  async function load(){
    $("leads").innerHTML = '<div class="empty">불러오는 중…</div>';
    const { data, error } = await sb.from("leads").select("*").order("created_at", { ascending: false }).limit(1000);
    if (error) { $("leads").innerHTML = `<div class="empty">불러오지 못했어요: ${esc(error.message)}</div>`; return; }
    rows = data || [];
    if (!rows.length) { /* 관리자가 아니면 보안 규칙 때문에 0건으로 보임 */ }
    stats(); chips(); render();
  }
  function stats(){
    const week = Date.now() - 7 * 864e5;
    $("s-all").textContent = rows.length;
    $("s-new").textContent = rows.filter(r => r.status === "신규").length;
    $("s-week").textContent = rows.filter(r => new Date(r.created_at) >= week).length;
    $("s-done").textContent = rows.filter(r => r.status === "완료").length;
  }
  function chips(){
    $("chips").innerHTML = ["전체", ...STATUSES].map(s => {
      const n = s === "전체" ? rows.length : rows.filter(r => r.status === s).length;
      return `<button class="chip" data-s="${s}" aria-pressed="${filter === s}">${s} ${n}</button>`;
    }).join("");
    $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.s; chips(); render(); });
  }
  function visible(){
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    return rows.filter(r => (filter === "전체" || r.status === filter) &&
      words.every(w => [r.company, r.region, r.industry, r.name, r.phone, r.email, r.message, r.memo].join(" ").toLowerCase().includes(w)));
  }
  function render(){
    const list = visible();
    if (!list.length) {
      $("leads").innerHTML = `<div class="empty">${rows.length ? "조건에 맞는 신청이 없어요." : "아직 들어온 상담 신청이 없어요."}</div>`;
      return;
    }
    $("leads").innerHTML = list.map(r => `
      <div class="lead ${r.status === "신규" ? "new" : ""}" data-id="${r.id}">
        <div>
          <h3>${esc(r.company)}</h3>
          ${r.region || r.industry ? `<div class="when"><b>${esc(r.region || "-")}</b> · ${esc(r.industry || "-")}</div>` : ""}
          <div class="when">${new Date(r.created_at).toLocaleString("ko-KR")} · #${r.id}</div>
          <div class="q">${esc(r.message)}</div>
        </div>
        <div class="contact">
          <b>${esc(r.name)}</b>
          <a href="tel:${esc(r.phone)}">📞 ${esc(r.phone)}</a>
          <a href="mailto:${esc(r.email)}">✉️ ${esc(r.email)}</a>
        </div>
        <div class="side">
          <div class="row">
            <select class="st st-${esc(r.status)}" aria-label="진행 상태">${STATUSES.map(s => `<option ${s === r.status ? "selected" : ""}>${s}</option>`).join("")}</select>
            <button class="btn danger del" title="삭제">삭제</button>
          </div>
          <textarea class="memo" placeholder="메모 (통화 내용, 다음 할 일 등)">${esc(r.memo)}</textarea>
          <div class="saved"></div>
        </div>
      </div>`).join("");
  }

  async function save(id, patch, el){
    const box = el.closest(".lead").querySelector(".saved");
    box.textContent = "저장 중…";
    const { error } = await sb.from("leads").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", id);
    if (error) { box.style.color = "var(--red)"; box.textContent = "저장 실패: " + error.message; return; }
    Object.assign(rows.find(r => r.id === id), patch);
    box.style.color = ""; box.textContent = "저장됨";
    setTimeout(() => { if (box.textContent === "저장됨") box.textContent = ""; }, 1500);
    stats(); chips();
  }
  $("leads").addEventListener("change", e => {
    if (!e.target.classList.contains("st")) return;
    const id = Number(e.target.closest(".lead").dataset.id);
    e.target.className = "st st-" + e.target.value;
    e.target.closest(".lead").classList.toggle("new", e.target.value === "신규");
    save(id, { status: e.target.value }, e.target);
  });
  $("leads").addEventListener("focusout", e => {
    if (!e.target.classList.contains("memo")) return;
    const id = Number(e.target.closest(".lead").dataset.id);
    const r = rows.find(x => x.id === id);
    if ((r.memo || "") !== e.target.value) save(id, { memo: e.target.value }, e.target);
  });
  $("leads").addEventListener("click", async e => {
    if (!e.target.classList.contains("del")) return;
    const card = e.target.closest(".lead"); const id = Number(card.dataset.id);
    const r = rows.find(x => x.id === id);
    if (!confirm(`'${r.company} ${r.name}' 신청을 완전히 삭제할까요?\n삭제하면 되돌릴 수 없습니다.`)) return;
    const { error } = await sb.from("leads").delete().eq("id", id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    rows = rows.filter(x => x.id !== id); stats(); chips(); render();
  });
  $("q").addEventListener("input", e => { q = e.target.value; render(); });
  $("refresh").onclick = load;
  $("csv").onclick = () => {
    const head = ["번호","접수시각","회사명","지역","업종","담당자","전화번호","이메일","문의내용","상태","메모"];
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [head.map(cell).join(",")].concat(visible().map(r =>
      [r.id, new Date(r.created_at).toLocaleString("ko-KR"), r.company, r.region, r.industry, r.name, r.phone, r.email, r.message, r.status, r.memo].map(cell).join(",")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `helprnd_상담신청_${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  };
})();
</script>
</body>
</html>
